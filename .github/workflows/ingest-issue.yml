name: Ingest Question from Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest-and-pr:
    if: github.event.label.name == 'submit-questions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync

      - name: Extract CSV from Issue Body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Write the issue body to a file.
          # We use a simple python inline script to strip any markdown code block backticks
          # just in case the user formatted it as a code block.
          python -c 'import os; body = os.environ.get("ISSUE_BODY", ""); lines = [l for l in body.splitlines() if not l.strip().startswith("```")]; open("temp.csv", "w", encoding="utf-8").write("\n".join(lines) + "\n")'
          cat temp.csv

      - name: Run Ingest Script
        run: |
          uv run yoink_questions --file temp.csv
          rm -f temp.csv

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Ingest new questions from issue #${{ github.event.issue.number }}"
          title: "Add questions from issue #${{ github.event.issue.number }}"
          body: |
            Automated PR to add questions submitted in #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          branch: "ingest-issue-${{ github.event.issue.number }}"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 I have processed the CSV from your issue and created a Pull Request with the new questions for review!'
            })
